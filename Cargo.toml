[package]
name = "scratchpad"
version = "0.40.0"
edition = "2024"
default-run = "scratchpad"

[dependencies]
eframe = "0.34.2"
egui-phosphor = "0.12.0"
rfd = "0.14"
regex = "1.11"
regex-syntax = "0.8"
memchr = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
chardetng = "0.1"
log = "0.4"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
rustc-hash = "2.0"
smallvec = { version = "1.13", features = ["serde"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
windows_file_watch = { path = "crates/windows_file_watch" }

[dev-dependencies]
criterion = "0.5"
rand = "0.10.0"
tempfile = "3.8"

[[bin]]
name = "count_lines"
path = "scripts/count_lines.rs"

[[bench]]
name = "search_speed"
path = "benches/search_speed.rs"
harness = false

[[bench]]
name = "frame_budget"
path = "benches/frame_budget.rs"
harness = false
