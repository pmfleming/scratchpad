[package]
name = "scratchpad"
version = "0.4.1"
edition = "2024"
default-run = "scratchpad"

[features]
inspection = ["eframe/inspection"]

[dependencies]
eframe = "0.35.0"
egui-phosphor = { path = "crates/egui_phosphor" }
rfd = "0.17.2"
regex = "1.12.4"
regex-syntax = "0.8.11"
memchr = "2.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
serde_yaml = "0.9.34"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
chardetng = "1.0.0"
log = "0.4.33"
fontdb = "0.23.0"
syn = { version = "2.0.118", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
rustc-hash = "2.1.2"
smallvec = { version = "2.0.0-alpha.12", features = ["serde"] }
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows_file_watch = { path = "crates/windows_file_watch" }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", features = ["glow"] }
linux_file_watch = { path = "crates/linux_file_watch" }
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.1"
tempfile = "3.27.0"

[[bin]]
name = "count_lines"
path = "scripts/count_lines.rs"

[[bench]]
name = "search_speed"
path = "benches/search_speed.rs"
harness = false

[[bench]]
name = "frame_budget"
path = "benches/frame_budget.rs"
harness = false
