[package]
name = "scratchpad"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
description = "A Windows-first plain-text editor focused on resilient local text work."
repository = "https://github.com/pmfleming/scratchpad"
homepage = "https://github.com/pmfleming/scratchpad"
readme = "README.md"
default-run = "scratchpad"

[features]
inspection = ["eframe/inspection"]
count-lines = ["dep:proc-macro2", "dep:syn"]

[dependencies]
eframe = "0.35.0"
egui-phosphor = { path = "crates/egui_phosphor" }
rfd = "0.17.2"
regex = "1.12.4"
regex-syntax = "0.8.11"
memchr = "2.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
log = "0.4.33"
fontdb = "0.23.0"
syn = { version = "2.0.118", features = ["full", "extra-traits", "visit"], optional = true }
proc-macro2 = { version = "1.0.106", features = ["span-locations"], optional = true }
rustc-hash = "2.1.2"
smallvec = "1.15.2"
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows_file_watch = { path = "crates/windows_file_watch" }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", features = ["glow"] }
linux_file_watch = { path = "crates/linux_file_watch" }
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.1"
tempfile = "3.27.0"

[[bin]]
name = "count_lines"
path = "scripts/count_lines.rs"
required-features = ["count-lines"]

[[bench]]
name = "search_speed"
path = "benches/search_speed.rs"
harness = false

[[bench]]
name = "frame_budget"
path = "benches/frame_budget.rs"
harness = false

[[bench]]
name = "promise_latency"
path = "benches/promise_latency.rs"
harness = false
