name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux/Hyprland Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdk-pixbuf-2.0-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config \
            wayland-protocols

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check Cargo and Nix package versions
        shell: bash
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          nix_version="$(nix eval --raw .#packages.x86_64-linux.scratchpad.version)"
          release_version="${{ steps.version.outputs.version }}"
          if [[ "$cargo_version" != "$release_version" ]]; then
            echo "Release version $release_version does not match Cargo.toml version $cargo_version." >&2
            exit 1
          fi
          if [[ "$nix_version" != "$release_version" ]]; then
            echo "Release version $release_version does not match flake.nix version $nix_version." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --lib --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build Linux release executable
        run: cargo build --release --locked

      - name: Package Linux archive
        run: ./scripts/package-linux-release.sh "${{ steps.version.outputs.version }}"

      - name: Check Nix flake and Hyprland package
        run: |
          nix flake check --print-build-logs
          nix build .#scratchpad-hyprland --print-build-logs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scratchpad-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --check

      - name: Run clippy
        shell: pwsh
        run: cargo clippy --lib --all-features -- -D warnings

      - name: Run tests
        shell: pwsh
        run: cargo test --locked

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check Cargo package version
        shell: pwsh
        run: |
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($cargoVersion -ne "${{ steps.version.outputs.version }}") {
            throw "Release version ${{ steps.version.outputs.version }} does not match Cargo.toml version $cargoVersion."
          }

      - name: Resolve Windows signing mode
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          function Has-EnvValue([string] $Name) {
            $value = [System.Environment]::GetEnvironmentVariable($Name)
            return -not [string]::IsNullOrWhiteSpace([string]$value)
          }

          $mode = ([string]$env:WINDOWS_SIGNING_MODE).Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $hasPfxSigning = (Has-EnvValue "WINDOWS_CODESIGN_PFX_BASE64") -and (Has-EnvValue "WINDOWS_CODESIGN_PFX_PASSWORD")
            $hasTrustedSigning = (Has-EnvValue "AZURE_CLIENT_ID") `
              -and (Has-EnvValue "AZURE_TENANT_ID") `
              -and (Has-EnvValue "AZURE_SUBSCRIPTION_ID") `
              -and (Has-EnvValue "AZURE_TRUSTED_SIGNING_ENDPOINT") `
              -and (Has-EnvValue "AZURE_TRUSTED_SIGNING_ACCOUNT") `
              -and (Has-EnvValue "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE")

            if ($hasPfxSigning -and $hasTrustedSigning) {
              throw "Both PFX and Azure signing settings are configured. Set WINDOWS_SIGNING_MODE to 'pfx' or 'trusted-signing'."
            } elseif ($hasPfxSigning) {
              $mode = "pfx"
            } elseif ($hasTrustedSigning) {
              $mode = "trusted-signing"
            } else {
              throw "Windows release signing is not configured. Add PFX or Azure signing settings, or set WINDOWS_SIGNING_MODE=none to publish unsigned installers."
            }
          }

          if ($mode -in @("azure", "azure-trusted-signing", "trusted-signing", "artifact-signing")) {
            $mode = "trusted-signing"
          } elseif ($mode -in @("certificate", "secret-certificate")) {
            $mode = "pfx"
          } elseif ($mode -notin @("none", "pfx")) {
            throw "Unsupported WINDOWS_SIGNING_MODE '$mode'. Use 'pfx', 'trusted-signing', or leave it empty."
          }

          if ($mode -eq "pfx") {
            foreach ($name in @("WINDOWS_CODESIGN_PFX_BASE64", "WINDOWS_CODESIGN_PFX_PASSWORD")) {
              if (-not (Has-EnvValue $name)) {
                throw "WINDOWS_SIGNING_MODE=pfx requires the $name secret."
              }
            }
          }

          if ($mode -eq "trusted-signing") {
            foreach ($name in @(
              "AZURE_CLIENT_ID",
              "AZURE_TENANT_ID",
              "AZURE_SUBSCRIPTION_ID",
              "AZURE_TRUSTED_SIGNING_ENDPOINT",
              "AZURE_TRUSTED_SIGNING_ACCOUNT",
              "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE"
            )) {
              if (-not (Has-EnvValue $name)) {
                throw "WINDOWS_SIGNING_MODE=trusted-signing requires $name."
              }
            }
          }

          "mode=$mode" >> $env:GITHUB_OUTPUT
          "enabled=$(($mode -ne "none").ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore WiX tool
        shell: pwsh
        run: dotnet tool restore

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked

      - name: Sign release executable with PFX certificate
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          .\scripts\sign-windows-artifact.ps1 `
            -FilePath .\target\release\scratchpad.exe `
            -PfxBase64 $env:WINDOWS_CODESIGN_PFX_BASE64 `
            -PfxPassword $env:WINDOWS_CODESIGN_PFX_PASSWORD

      - name: Azure login for Trusted Signing
        if: steps.signing.outputs.mode == 'trusted-signing'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release executable with Azure Artifact Signing
        if: steps.signing.outputs.mode == 'trusted-signing'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\target\release\scratchpad.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          .\scripts\package-windows-installer.ps1 -Version $version

      - name: Sign Windows installer with PFX certificate
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $installer = Get-Item .\dist\*.msi | Select-Object -First 1
          .\scripts\sign-windows-artifact.ps1 `
            -FilePath $installer.FullName `
            -PfxBase64 $env:WINDOWS_CODESIGN_PFX_BASE64 `
            -PfxPassword $env:WINDOWS_CODESIGN_PFX_PASSWORD

      - name: Sign Windows installer with Azure Artifact Signing
        if: steps.signing.outputs.mode == 'trusted-signing'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\scratchpad-v${{ steps.version.outputs.version }}-windows-x64.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Update signed installer checksum
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installer = Get-Item .\dist\*.msi | Select-Object -First 1
          .\scripts\update-windows-installer-checksum.ps1 -InstallerPath $installer.FullName

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scratchpad-windows-x64-msi
          path: |
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scratchpad-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Scratchpad ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/*.tar.gz
            dist/*.sha256
