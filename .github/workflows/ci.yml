name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Format, Lint, Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check formatting
        run: cargo fmt --check

      - name: Check feature combinations
        run: cargo hack check --feature-powerset

      - name: Lint
        run: cargo clippy --lib --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2

  cross-targets:
    name: Cross-target cargo check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdk-pixbuf-2.0-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config \
            wayland-protocols

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install cross-check targets
        run: rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu

      - name: Run cross-target checks
        run: ./scripts/check-targets.sh x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
