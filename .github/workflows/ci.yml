name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-engine:
    name: Pinned session engine contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install workflow validators
        uses: taiki-e/install-action@v2
        with:
          tool: actionlint,shellcheck
      - name: Validate workflow and target-check script
        run: |
          actionlint
          shellcheck scripts/check-targets.sh
      - name: Check xtask formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - name: Lint xtask
        run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - name: Test xtask
        run: cargo test --locked --manifest-path xtask/Cargo.toml
      - name: Check application and contract engine identities
        run: cargo xtask check-turso-locks
      - name: Run isolated engine contract
        run: cargo run --locked --manifest-path tools/turso-contract/Cargo.toml

  windows:
    name: Windows native format, lint and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check formatting
        run: cargo fmt --check

      - name: Check feature combinations
        run: cargo hack check --feature-powerset --locked

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  linux:
    name: Linux Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdk-pixbuf-2.0-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config \
            wayland-protocols

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Lint Linux code
        run: |
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path crates/linux_file_watch/Cargo.toml -- -D warnings

      - name: Test Linux application code
        run: cargo test --all-features --locked

      - name: Test Linux file watcher
        run: cargo test --manifest-path crates/linux_file_watch/Cargo.toml

      - name: Test isolated icon font integration
        run: cargo test --manifest-path crates/egui_phosphor/Cargo.toml

      # Expensive and currently partial: explicitly dispatched, never silently
      # allowed to pass. Normal PR gates above remain independently required.
      - name: Install quality evidence tools
        if: github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-hack,cargo-llvm-cov

      - name: Checkout pinned RustQualityLens
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: pmfleming/rust-quality-lens
          ref: d28f3d936fa3c0d4c0a7ea753f436517077cb37d
          path: target/rqlens-source
          persist-credentials: false

      - name: Build pinned RustQualityLens
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release --locked --manifest-path target/rqlens-source/Cargo.toml --bin rqlens --target-dir target/rqlens-build

      - name: Collect and strictly gate fresh quality evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target
        run: cargo xtask quality target/rqlens-build/release/rqlens "target/quality-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Preserve quality evidence even when incomplete or failed
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: target/quality-ci-*/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit maintenance dependencies
        if: always()
        run: cargo audit --file xtask/Cargo.lock --json > audit-xtask.json

      - name: Preserve audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-xtask.json
          if-no-files-found: error

  cross-targets:
    name: Cross-target cargo check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-dev \
            libcairo2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdk-pixbuf-2.0-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config \
            wayland-protocols

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install cross-check targets
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu

      - name: Run cross-target checks
        run: ./scripts/check-targets.sh --require-all x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
