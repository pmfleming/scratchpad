project_name = "scratchpad"
project_root = "."
source_roots = ["src", "tests", "crates", "benches", "examples", "scripts", "xtask/src"]
output_dir = "target/analysis"
fingerprint_inputs = ["fonts", "src/assets", "assets", "scripts/check-targets.sh", ".github/workflows", "xtask/Cargo.toml", "xtask/Cargo.lock"]

[rust]
identity_resolution = "auto"
identity_timeout_seconds = 60

[verification]
timeout_seconds = 1200
workspace = true
all_targets = false
all_features = true
locked = true
audit = true
deny = false
feature_matrix = true

[policy.rules."rust.project.license"]
level = "error"
max = 0

[policy.rules."rust.safety.undocumented-unsafe"]
level = "error"
max = 0

[policy.rules."rust.safety.missing-safety-docs"]
level = "error"
max = 0

[policy.rules."rust.reliability.expect"]
level = "error"
max = 10
exclude_paths = ["src/bin/**", "src/profile/**"]

[policy.rules."rust.reliability.unwrap"]
level = "error"
max = 0
exclude_paths = ["src/bin/**", "src/profile/**"]

[policy.rules."rust.reliability.panic"]
level = "error"
max = 3
exclude_paths = ["src/bin/**", "src/profile/**"]

# AI-authored drafts are pending, not human acceptance. These obligations remain
# blocking until a human records a bound, reasoned, time-limited decision.
[design_review]
manifest = ".config/rqlens-design-reviews.json"

[[design_review.requirements]]
id = "path-key-newtype-v1"
topic = "newtypes"
sources = ["src/app/mod.rs"]
required = true
max_age_days = 90

[[design_review.requirements]]
id = "path-key-documentation-v1"
topic = "documentation-usefulness"
sources = ["src/app/mod.rs"]
required = true
max_age_days = 90

[[design_review.requirements]]
id = "windows-watch-unsafe-necessity-v1"
topic = "unsafe-necessity"
sources = ["crates/windows_file_watch/src/lib.rs"]
required = true
max_age_days = 90

[policy.rules."rust.design.required-review"]
level = "error"
max = 0
