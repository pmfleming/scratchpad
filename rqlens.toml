project_name = "scratchpad"
project_root = "."
source_roots = ["src", "tests", "crates", "benches", "examples", "scripts", "xtask/src"]
output_dir = "target/analysis"
fingerprint_inputs = ["fonts", "src/assets", "assets", "scripts/check-targets.sh", ".github/workflows", "xtask/Cargo.toml", "xtask/Cargo.lock"]

[rust]
identity_resolution = "auto"
identity_timeout_seconds = 60

[verification]
timeout_seconds = 1200
workspace = true
all_targets = false
all_features = true
locked = true
audit = true
deny = false
feature_matrix = true

[policy.rules."rust.project.license"]
level = "error"
max = 0

[policy.rules."rust.safety.undocumented-unsafe"]
level = "error"
max = 0

[policy.rules."rust.safety.missing-safety-docs"]
level = "error"
max = 0

[policy.rules."rust.reliability.expect"]
level = "error"
max = 12
exclude_paths = ["src/bin/**", "src/profile/**"]

[policy.rules."rust.reliability.unwrap"]
level = "error"
max = 0
exclude_paths = ["src/bin/**", "src/profile/**"]

[policy.rules."rust.reliability.panic"]
level = "error"
max = 3
exclude_paths = ["src/bin/**", "src/profile/**"]
